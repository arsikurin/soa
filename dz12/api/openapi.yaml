openapi: 3.0.3
info:
  title: Marketplace API
  version: 2.0.0
  description: An OpenAPI gateway calls Users, Catalog and Orders over gRPC with mutual TLS. Each service owns its PostgreSQL database. Order mutations and stock changes use recoverable two-phase commit. JSON errors use error_code, message and optional details. Request
    validation precedes business logic. Monetary values are exact decimal amounts with two fractional digits. Every
    response includes X-Request-Id. JSON bodies are limited to 1 MiB, nesting to 64 levels, and field paths to 256 bytes. Numeric tokens contain at most 64 characters
    and any exponent must be between -18 and 18; violations return VALIDATION_ERROR with the field path.
servers:
  - url: http://localhost:8080
    description: Gateway
security:
- BearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: getHealth
      description: HTTP process health. HEAD returns the same headers without a response body.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
      security: []
    head:
      operationId: headHealth
      summary: headHealth
      description: HTTP process health. HEAD returns the same headers without a response body.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Error'
      security: []
  /products:
    get:
      operationId: listProducts
      summary: listProducts
      description: USER, SELLER, ADMIN. Includes archived products unless status is filtered. Category comparison
        is exact. Stable order by creation time and ID.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ProductStatus'
      - name: category
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\x00]*$
    post:
      operationId: createProduct
      summary: createProduct
      description: SELLER creates own products; ADMIN may choose seller_id.
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
  /products/{id}:
    get:
      operationId: getProduct
      summary: getProduct
      description: USER, SELLER, ADMIN. ACTIVE, INACTIVE and ARCHIVED products may be read.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PRODUCT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - &id001
        name: id
        in: path
        required: true
        schema: &id002
          type: string
          format: uuid
    put:
      operationId: updateProduct
      summary: updateProduct
      description: SELLER updates own products; ADMIN may update any product.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PRODUCT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      parameters:
      - *id001
    delete:
      operationId: deleteProduct
      summary: deleteProduct
      description: SELLER archives own products; ADMIN may archive any product. Sets status ARCHIVED, preserves
        the row.
      responses:
        '204':
          description: Successful operation; empty body.
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PRODUCT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
  /orders:
    post:
      operationId: createOrder
      summary: createOrder
      description: USER or ADMIN creates an order for self. One active CREATED/PAYMENT_PENDING order per user. Successful
        CREATE_ORDER operations are rate-limited. Validation, reservation, price snapshots, promo usage and operation
        recording are atomic.
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: PRODUCT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict: ORDER_HAS_ACTIVE, PRODUCT_INACTIVE, INSUFFICIENT_STOCK.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'PROMO_CODE_INVALID: unavailable, inactive, expired, or exhausted promo; PROMO_CODE_MIN_AMOUNT:
            subtotal is below promo minimum.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'ORDER_LIMIT_EXCEEDED: the same successful order operation was performed too recently.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
  /orders/{id}:
    get:
      operationId: getOrder
      summary: getOrder
      description: USER reads own orders; ADMIN reads any order. SELLER forbidden.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership. ORDER_OWNERSHIP_VIOLATION: order belongs
            to another user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
    put:
      operationId: updateOrder
      summary: updateOrder
      description: USER updates own CREATED order; ADMIN may update any CREATED order. Successful UPDATE_ORDER operations
        are rate-limited. Stock, snapshots, promo and items change atomically.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership. ORDER_OWNERSHIP_VIOLATION: order belongs
            to another user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND or PRODUCT_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict: INVALID_STATE_TRANSITION, PRODUCT_INACTIVE, INSUFFICIENT_STOCK.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 'PROMO_CODE_INVALID: unavailable, inactive, expired, or exhausted promo. Falling below the
            minimum removes the promo and succeeds.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'ORDER_LIMIT_EXCEEDED: the same successful order operation was performed too recently.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      parameters:
      - *id001
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      summary: cancelOrder
      description: USER cancels own order; ADMIN may cancel any order. Only CREATED/PAYMENT_PENDING can transition
        to CANCELED. Restores stock and releases promo use atomically. Repeated cancellation returns conflict.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership. ORDER_OWNERSHIP_VIOLATION: order belongs
            to another user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict: INVALID_STATE_TRANSITION.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - *id001
  /orders/{id}/status:
    post:
      operationId: changeOrderStatus
      summary: changeOrderStatus
      description: ADMIN only. One forward transition CREATED -> PAYMENT_PENDING -> PAID -> SHIPPED -> COMPLETED.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: ORDER_NOT_FOUND.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict: INVALID_STATE_TRANSITION.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      parameters:
      - *id001
  /promo-codes:
    post:
      operationId: createPromoCode
      summary: createPromoCode
      description: SELLER or ADMIN creates a unique promo code.
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoCodeResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'TOKEN_INVALID or TOKEN_EXPIRED: missing, invalid, or expired access JWT.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: 'ACCESS_DENIED: forbidden role or seller ownership.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict: PROMO_CODE_EXISTS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoCodeCreate'
  /auth/register:
    post:
      operationId: register
      summary: register
      description: Public registration. Only USER or SELLER is allowed; ADMIN is provisioned separately.
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 'Conflict: EMAIL_ALREADY_EXISTS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      security: []
  /auth/login:
    post:
      operationId: login
      summary: login
      description: Public login. Access JWT expires after 15 minutes; refresh JWT after 7 days.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'INVALID_CREDENTIALS: email or password is incorrect.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /auth/refresh:
    post:
      operationId: refresh
      summary: refresh
      description: Public refresh. Consumes and rotates the refresh token atomically; replay is rejected. Refresh
        tokens cannot authenticate protected endpoints.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          description: 'VALIDATION_ERROR: invalid JSON, fields, parameters, or duplicate product IDs; details.fields
            identifies invalid fields.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 'REFRESH_TOKEN_INVALID: refresh token is invalid, expired, or already consumed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: 'SERVICE_UNAVAILABLE: an internal service is temporarily unavailable. TRANSACTION_PENDING: an order transaction outcome is being resolved; details contain transaction_id and order_id. Check the order after recovery before retrying a mutation.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 'INTERNAL_ERROR: unexpected server failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      security: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'HS256 access JWT with sub, role, issuer, audience, expiry and token_type=access. Roles: USER,
        SELLER, ADMIN.'
  responses:
    Error:
      description: Unexpected or business error. The HTTP status and error_code identify the failure; tokens and
        passwords are never included.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Health:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
    Error:
      type: object
      additionalProperties: false
      required:
      - error_code
      - message
      properties:
        error_code:
          type: string
          description: Stable machine-readable error code. See operation responses and ErrorCode.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: 'Validation: fields is an array of {field,message}. Stock shortages: products is an array
            of {product_id,requested,available}.'
    ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - PRODUCT_NOT_FOUND
      - PRODUCT_INACTIVE
      - INSUFFICIENT_STOCK
      - ORDER_NOT_FOUND
      - ORDER_OWNERSHIP_VIOLATION
      - INVALID_STATE_TRANSITION
      - ORDER_LIMIT_EXCEEDED
      - ORDER_HAS_ACTIVE
      - PROMO_CODE_INVALID
      - PROMO_CODE_MIN_AMOUNT
      - PROMO_CODE_EXISTS
      - TOKEN_EXPIRED
      - TOKEN_INVALID
      - REFRESH_TOKEN_INVALID
      - ACCESS_DENIED
      - EMAIL_ALREADY_EXISTS
      - INVALID_CREDENTIALS
      - NOT_FOUND
      - METHOD_NOT_ALLOWED
      - INTERNAL_ERROR
      - SERVICE_UNAVAILABLE
      - TRANSACTION_PENDING
      - TRANSACTION_CONFLICT
    ProductStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - ARCHIVED
    OrderStatus:
      type: string
      enum:
      - CREATED
      - PAYMENT_PENDING
      - PAID
      - SHIPPED
      - COMPLETED
      - CANCELED
    Role:
      type: string
      enum:
      - USER
      - SELLER
      - ADMIN
    DiscountType:
      type: string
      enum:
      - PERCENTAGE
      - FIXED_AMOUNT
    ProductCreate:
      type: object
      additionalProperties: false
      required: &id003
      - name
      - price
      - stock
      - category
      - status
      properties: &id004
        name: &id005
          type: string
          minLength: 1
          maxLength: 255
          pattern: ^[^\x00]*$
        description: &id006
          type: string
          nullable: true
          maxLength: 4000
          pattern: ^[^\x00]*$
        price: &id007
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        stock: &id008
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483647
        category: &id009
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[^\x00]*$
        status: &id010
          $ref: '#/components/schemas/ProductStatus'
        seller_id: *id002
      description: SELLER creates own products; ADMIN may specify an existing SELLER or ADMIN as seller_id.
    ProductUpdate:
      type: object
      additionalProperties: false
      required: *id003
      properties: *id004
      description: Full replacement of editable fields. SELLER may update own products; ADMIN may specify an existing
        SELLER or ADMIN as seller_id. Omitted description clears it.
    ProductResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - price
      - stock
      - category
      - status
      - seller_id
      - created_at
      - updated_at
      properties:
        id: *id002
        name: *id005
        description: *id006
        price: *id007
        stock: *id008
        category: *id009
        status: *id010
        seller_id: *id002
        created_at: &id011
          type: string
          format: date-time
        updated_at: *id011
    ProductPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      - size
      - totalElements
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductResponse'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
    OrderItemRequest:
      type: object
      additionalProperties: false
      required:
      - product_id
      - quantity
      properties:
        product_id: *id002
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
    OrderCreate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items: &id012
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItemRequest'
          description: product_id must be unique within the request.
        promo_code:
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
    OrderUpdate:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items: *id012
      description: Replace all items of a CREATED order. Existing promo is revalidated; if the new subtotal is below
        its minimum, it is removed. Product prices are read again.
    OrderItemResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - product_id
      - quantity
      - price_at_order
      properties:
        id: *id002
        product_id: *id002
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
        price_at_order:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
    OrderResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - status
      - total_amount
      - discount_amount
      - promo_code_id
      - items
      - created_at
      - updated_at
      properties:
        id: *id002
        user_id: *id002
        status:
          $ref: '#/components/schemas/OrderStatus'
        total_amount:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        discount_amount:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        promo_code_id:
          type: string
          format: uuid
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemResponse'
        created_at: *id011
        updated_at: *id011
    OrderStatusUpdate:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - PAYMENT_PENDING
          - PAID
          - SHIPPED
          - COMPLETED
      description: 'ADMIN only. Exactly one forward step: CREATED -> PAYMENT_PENDING -> PAID -> SHIPPED -> COMPLETED.
        Use cancel operation for cancellation.'
    PromoCodeCreate:
      type: object
      additionalProperties: false
      required:
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      properties:
        code: &id013
          type: string
          pattern: ^[A-Z0-9_]{4,20}$
        discount_type: &id014
          $ref: '#/components/schemas/DiscountType'
        discount_value: &id015
          type: number
          format: decimal
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
        min_order_amount: &id016
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        max_uses: &id017
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        valid_from: *id011
        valid_until: *id011
        active:
          type: boolean
          default: true
      description: SELLER or ADMIN. valid_until must be after valid_from. Both validity interval endpoints are inclusive. PERCENTAGE above 70 produces discount_amount=0
        (full price); at most 70% is discounted, rounded to cents with the cap rounded down. FIXED_AMOUNT is capped
        at subtotal.
    PromoCodeResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - discount_type
      - discount_value
      - min_order_amount
      - max_uses
      - valid_from
      - valid_until
      - active
      - current_uses
      - created_at
      - updated_at
      properties:
        id: *id002
        code: *id013
        discount_type: *id014
        discount_value: *id015
        min_order_amount: *id016
        max_uses: *id017
        valid_from: *id011
        valid_until: *id011
        active:
          type: boolean
        current_uses:
          type: integer
          format: int32
          minimum: 0
        created_at: *id011
        updated_at: *id011
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          pattern: ^[^\x00]*$
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
        role:
          type: string
          enum:
          - USER
          - SELLER
          default: USER
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          pattern: ^[^\x00]*$
        password:
          type: string
          minLength: 8
          maxLength: 72
          format: password
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 8192
    UserResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - role
      - created_at
      - updated_at
      properties:
        id: *id002
        email:
          type: string
          format: email
          pattern: ^[^\x00]*$
        role:
          $ref: '#/components/schemas/Role'
        created_at: *id011
        updated_at: *id011
    TokenPair:
      type: object
      additionalProperties: false
      required:
      - access_token
      - refresh_token
      - token_type
      - expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          format: int32
          minimum: 1
